<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseAlert - Hệ thống cảnh báo tư thế ngồi học</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
</head>
<body>

    <div class="container" style="padding: 20px; font-family: sans-serif;">
        <h1>🧘‍♂️ PoseAlert: Hệ thống cảnh báo tư thế ngồi học</h1>
        
        <div class="main-layout" style="display: flex; gap: 20px;">
            <div class="left-panel">
                <div class="video-box" style="border: 2px dashed #ccc; width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; position: relative;">
                    <canvas id="canvas"></canvas>
                    <div id="loading-model" style="position: absolute;">🔄 Đang tải mô hình AI & Camera...</div>
                </div>
                
                <div id="status-card" style="margin-top: 10px; padding: 10px; background: #e2e8f0; border-radius: 5px;">
                    <span id="status-text">Đang khởi tạo hệ thống...</span>
                </div>
                
                <div id="alert-box" style="margin-top: 10px; padding: 15px; background: #fee2e2; color: #dc2626; border-left: 5px solid #dc2626; font-weight: bold;" class="hidden"></div>

                <div style="margin-top: 15px;">
                    <button id="btn-camera" onclick="toggleCamera()" style="padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #dc2626; color: white; border: none; border-radius: 5px; transition: background 0.3s;">
                        🛑 Dừng camera (Dừng học)
                    </button>
                </div>
                </div> <div class="right-panel">
                <p>Mô hình AI sẽ tự động kích hoạt Webcam sau khi tải xong trọng số.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
