<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseAlert - Hệ thống cảnh báo tư thế ngồi học</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <h1 class="main-title">🧘‍♂️ PoseAlert: Hệ thống cảnh báo tư thế ngồi học</h1>
        
        <div class="main-layout">
            
            <div class="left-panel">
                <div class="video-box">
                    <canvas id="canvas"></canvas>
                    <div id="loading-model">🔄 Đang tải mô hình AI & Camera...</div>
                </div>
                
                <div id="status-card" class="status-neutral">
                    <span id="status-text">Đang khởi tạo hệ thống...</span>
                </div>
                
                <div id="alert-box"></div>

                <div class="control-group">
                    <button id="btn-camera" onclick="toggleCamera()" class="btn btn-danger">
                        🛑 Dừng camera (Dừng học)
                    </button>
                </div>
            </div>

            <div class="right-panel">
                <div class="card pomodoro-card">
                    <h3>⏱️ Chế độ học Pomodoro</h3>
                    <div id="pomodoro-status">Trạng thái: Sẵn sàng học</div>
                    <div id="timer">25:00</div>
                    
                    <div class="btn-group">
                        <button id="btn-timer" onclick="togglePomodoro()" class="btn btn-primary">◀️ Bắt đầu học</button>
                        <button id="btn-reset-timer" onclick="resetPomodoro()" class="btn btn-secondary">🔄 Đặt lại</button>
                    </div>
                </div>

                <div class="card chart-card">
                    <h3>📊 Thống kê tỷ lệ tư thế</h3>
                    <div class="chart-container">
                        <canvas id="postureChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
